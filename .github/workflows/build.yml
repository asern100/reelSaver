name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          if ! gradle assembleDebug --no-daemon 2>&1 | tee build.log; then
            grep -E "^e: |error:|ERROR:|AAPT|resource .* not found|Unresolved|Caused by" build.log | grep -v "> Task" | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ReelSaver-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Prepare music-removal test clip (speech + music)
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
          pip install -q numpy
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/librosa/data ld
          (cd ld && git sparse-checkout set --no-cone /audio/198-209-0000.hq.ogg "/audio/Kevin_MacLeod_-_Vibe_Ace.hq.ogg")
          mkdir -p nmtest
          python3 ci/nm_mix.py make ld/audio/198-209-0000.hq.ogg "ld/audio/Kevin_MacLeod_-_Vibe_Ace.hq.ogg" nmtest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          script: ./ci/smoke.sh && ./ci/music_test.sh
      - name: Publish screenshots
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q && git checkout -q -b screenshots
          git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "screenshots ${{ github.sha }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} screenshots
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.${{ github.run_number }}
          name: ReelSaver v1.8.${{ github.run_number }}
          body: |
            حمّل app-arm64-v8a-debug.apk (أغلب التلفونات). للتلفونات القديمة: app-armeabi-v7a-debug.apk
          files: |
            app/build/outputs/apk/debug/*arm64-v8a*.apk
            app/build/outputs/apk/debug/*armeabi-v7a*.apk
